<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Samrat's AI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --bg2: #111118; --bg3: #1a1a24;
    --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.12);
    --text: #e8e8f0; --text2: #8888aa;
    --accent: #7f77dd; --accent2: #534ab7; --accent-glow: rgba(127,119,221,0.15);
  }
  html.light {
    --bg: #f4f4f8; --bg2: #ffffff; --bg3: #e8e8f0;
    --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15);
    --text: #1a1a2e; --text2: #6666aa;
    --accent: #7f77dd; --accent2: #534ab7; --accent-glow: rgba(127,119,221,0.1);
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; transition: background 0.3s, color 0.3s; }
  .app { display: flex; height: 100vh; height: 100dvh; }

  /* ── Sidebar ── */
  .sidebar {
    width: 260px; min-width: 260px;
    background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 1.25rem 0.75rem; gap: 0.5rem;
    transition: transform 0.3s ease;
    z-index: 50;
  }
  .sidebar-title { font-size: 15px; font-weight: 700; letter-spacing: 0.05em; color: var(--text); padding: 0 0.5rem 0.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-title-left { display: flex; align-items: center; gap: 8px; }
  .sidebar-title span { color: var(--accent); }
  .settings-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 6px; transition: color 0.2s, background 0.2s; }
  .settings-btn:hover { color: var(--accent); background: var(--accent-glow); }
  .new-chat-btn { margin-top: 0.5rem; background: var(--accent-glow); border: 1px solid var(--accent2); color: var(--accent); padding: 9px 14px; border-radius: 8px; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
  .new-chat-btn:hover { background: rgba(127,119,221,0.25); }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin-top: 0.5rem; }
  .chat-list::-webkit-scrollbar { width: 3px; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .chat-item { display: flex; align-items: center; gap: 6px; border-radius: 7px; padding: 2px; transition: background 0.15s; }
  .chat-item:hover { background: var(--bg3); }
  .chat-item.active { background: var(--accent-glow); }
  .chat-item-btn { flex: 1; background: none; border: none; color: var(--text2); font-family: 'Syne', sans-serif; font-size: 12.5px; text-align: left; padding: 7px 8px; cursor: pointer; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.15s; }
  .chat-item.active .chat-item-btn { color: var(--text); }
  .del-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 4px 6px; border-radius: 5px; font-size: 13px; opacity: 0; transition: opacity 0.15s, color 0.15s; flex-shrink: 0; }
  .chat-item:hover .del-btn { opacity: 1; }
  .chat-item .del-btn { opacity: 0.5; } /* always slightly visible on mobile */
  .del-btn:hover { color: #e24b4a; }

  /* Mobile overlay */
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
  .sidebar-overlay.open { display: block; }

  /* Mobile header */
  .mobile-header { display: none; padding: 0.75rem 1rem; background: var(--bg2); border-bottom: 1px solid var(--border); align-items: center; justify-content: space-between; flex-shrink: 0; }
  .mobile-header-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .mobile-header-title span { color: var(--accent); }
  .mobile-header-right { display: flex; align-items: center; gap: 8px; }
  .hamburger { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 20px; padding: 4px; }
  .mobile-settings-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; padding: 4px; }

  /* Settings panel */
  .settings-panel { display: none; position: fixed; top: 0; right: 0; width: 280px; height: 100vh; background: var(--bg2); border-left: 1px solid var(--border2); z-index: 100; padding: 1.5rem; flex-direction: column; gap: 1.5rem; box-shadow: -4px 0 24px rgba(0,0,0,0.3); }
  .settings-panel.open { display: flex; }
  .settings-header { display: flex; align-items: center; justify-content: space-between; }
  .settings-header h2 { font-size: 15px; font-weight: 700; color: var(--text); }
  .close-settings { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 18px; }
  .settings-section { display: flex; flex-direction: column; gap: 12px; }
  .settings-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--text2); text-transform: uppercase; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-row span { font-size: 13px; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .toggle { position: relative; width: 40px; height: 22px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg3); border-radius: 22px; transition: 0.3s; border: 1px solid var(--border2); }
  .toggle-slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background: var(--text2); border-radius: 50%; transition: 0.3s; }
  input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent2); }
  input:checked + .toggle-slider:before { transform: translateX(18px); background: white; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .chat-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text2); font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 10px; }
  .chat-header .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex-shrink: 0; }
  .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; -webkit-overflow-scrolling: touch; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .msg { display: flex; gap: 8px; max-width: 820px; width: 100%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
  .avatar.ai { background: var(--accent-glow); border: 1px solid var(--accent2); color: var(--accent); }
  .avatar.user-av { background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); }
  .bubble { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.7; color: var(--text); font-family: 'JetBrains Mono', monospace; max-width: calc(100% - 36px); word-break: break-word; }
  .msg.user .bubble { background: var(--bg3); border-color: var(--border2); }
  .bubble strong { color: var(--accent); font-weight: 500; }
  .bubble code { background: rgba(127,119,221,0.1); color: #afa9ec; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .bubble pre { background: #0d0d14; border: 1px solid var(--border2); border-radius: 8px; padding: 10px; margin: 8px 0; overflow-x: auto; font-size: 12px; line-height: 1.6; }

  /* image preview inside a chat bubble — like Claude/Gemini */
  /* max-width: 100% stops the image overflowing the bubble */
  /* max-height: 300px keeps tall images from taking over the screen */
  /* border-radius matches the bubble style */
  .bubble-image { max-width: 100%; max-height: 300px; border-radius: 8px; display: block; margin-bottom: 6px; border: 1px solid var(--border2); }

  /* pending image preview — shown in the input area before sending */
  /* this is the small thumbnail that appears when you pick a file */
  .pending-image-wrap { position: relative; display: inline-block; margin-bottom: 6px; }
  .pending-image-preview { max-height: 80px; max-width: 120px; border-radius: 8px; border: 1px solid var(--accent2); display: block; }
  .pending-image-remove { position: absolute; top: -6px; right: -6px; background: #e24b4a; border: none; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }

  /* Thinking */
  .thinking-wrap { display: flex; gap: 8px; align-items: flex-start; max-width: 820px; }
  .thinking-bubble { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .thinking-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text2); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

  /* Input area */
  .input-area { padding: 0.5rem 0.75rem 0.75rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; background: var(--bg2); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 12px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; resize: none; outline: none; transition: border-color 0.2s; min-height: 44px; max-height: 120px; overflow-y: auto; line-height: 1.5; -webkit-appearance: none; }
  textarea:focus { border-color: var(--accent2); }
  textarea::placeholder { color: var(--text2); }
  .send-btn { background: var(--accent); border: none; color: white; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .send-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .stop-btn { background: #e24b4a; border: none; color: white; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; font-size: 16px; display: none; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .stop-btn:hover { background: #c73b3a; transform: scale(1.05); }
  .stop-btn.visible { display: flex; }

  /* paperclip upload button — sits next to the textarea */
  .upload-btn { background: none; border: 1px solid var(--border2); color: var(--text2); width: 44px; height: 44px; border-radius: 10px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .upload-btn:hover { border-color: var(--accent2); color: var(--accent); background: var(--accent-glow); }

  /* doc indicator — shows filename of uploaded file above input row */
  /* hidden by default, only shown when a file is uploaded */
  .doc-indicator { display: none; align-items: center; gap: 8px; padding: 5px 10px; background: var(--accent-glow); border: 1px solid var(--accent2); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); }
  .doc-indicator.visible { display: flex; }
  .doc-indicator-remove { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; padding: 0 2px; opacity: 0.7; }
  .doc-indicator-remove:hover { opacity: 1; }

  /* Emoji */
  .emoji-bar { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .emoji-bar::-webkit-scrollbar { display: none; }
  .emoji-bar-label { font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace; white-space: nowrap; flex-shrink: 0; }
  .emoji-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 2px 3px; border-radius: 6px; transition: background 0.15s; line-height: 1; flex-shrink: 0; }
  .emoji-btn:hover { background: var(--bg3); }
  .emoji-toggle { background: none; border: 1px solid var(--border2); color: var(--text2); font-size: 11px; cursor: pointer; padding: 3px 7px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
  .emoji-toggle:hover { border-color: var(--accent2); color: var(--accent); }
  .emoji-more { display: none; }
  .emoji-more.open { display: flex; flex-wrap: wrap; gap: 3px; padding-top: 4px; }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    .sidebar {
      position: fixed; top: 0; left: 0;
      height: 100vh; height: 100dvh;
      transform: translateX(-100%);
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .chat-header { display: none; }
    .mobile-header { display: flex; }
    .del-btn { opacity: 0.6 !important; }
    .bubble { font-size: 13px; }
    .messages { padding: 0.75rem; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">
      <div class="sidebar-title-left">⬡ Samrat's <span>AI</span></div>
      <button class="settings-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">＋ New conversation</button>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Mobile header -->
    <div class="mobile-header">
      <button class="hamburger" onclick="openSidebar()">☰</button>
      <div class="mobile-header-title">⬡ Samrat's <span>AI</span></div>
      <div class="mobile-header-right">
        <button class="mobile-settings-btn" onclick="toggleSettings()">⚙️</button>
        <button class="mobile-settings-btn" onclick="newChat()">＋</button>
      </div>
    </div>

    <!-- Desktop header -->
    <div class="chat-header">
      <div class="dot"></div>
      <span id="chatTitle">Select a conversation</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="emoji-bar">
        <span class="emoji-bar-label">emoji:</span>
        <button class="emoji-btn" onclick="insertEmoji('😊')">😊</button>
        <button class="emoji-btn" onclick="insertEmoji('😂')">😂</button>
        <button class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
        <button class="emoji-btn" onclick="insertEmoji('👍')">👍</button>
        <button class="emoji-btn" onclick="insertEmoji('❤️')">❤️</button>
        <button class="emoji-btn" onclick="insertEmoji('🤔')">🤔</button>
        <button class="emoji-btn" onclick="insertEmoji('😎')">😎</button>
        <button class="emoji-btn" onclick="insertEmoji('🚀')">🚀</button>
        <button class="emoji-toggle" onclick="toggleMoreEmoji()">more ▾</button>
      </div>
      <div class="emoji-more" id="emojiMore">
        <button class="emoji-btn" onclick="insertEmoji('😭')">😭</button>
        <button class="emoji-btn" onclick="insertEmoji('😤')">😤</button>
        <button class="emoji-btn" onclick="insertEmoji('🥳')">🥳</button>
        <button class="emoji-btn" onclick="insertEmoji('😴')">😴</button>
        <button class="emoji-btn" onclick="insertEmoji('🤯')">🤯</button>
        <button class="emoji-btn" onclick="insertEmoji('💀')">💀</button>
        <button class="emoji-btn" onclick="insertEmoji('👀')">👀</button>
        <button class="emoji-btn" onclick="insertEmoji('💯')">💯</button>
        <button class="emoji-btn" onclick="insertEmoji('🎉')">🎉</button>
        <button class="emoji-btn" onclick="insertEmoji('😍')">😍</button>
        <button class="emoji-btn" onclick="insertEmoji('🙏')">🙏</button>
        <button class="emoji-btn" onclick="insertEmoji('💪')">💪</button>
        <button class="emoji-btn" onclick="insertEmoji('🤣')">🤣</button>
        <button class="emoji-btn" onclick="insertEmoji('😅')">😅</button>
        <button class="emoji-btn" onclick="insertEmoji('✨')">✨</button>
        <button class="emoji-btn" onclick="insertEmoji('🎮')">🎮</button>
        <button class="emoji-btn" onclick="insertEmoji('💻')">💻</button>
        <button class="emoji-btn" onclick="insertEmoji('🧠')">🧠</button>
        <button class="emoji-btn" onclick="insertEmoji('⚡')">⚡</button>
        <button class="emoji-btn" onclick="insertEmoji('🌙')">🌙</button>
      </div>
      <!-- pending image preview: thumbnail shown before user sends message -->
      <!-- hidden by default, shown when an image is selected/pasted -->
      <div id="pendingImageWrap" style="display:none; padding: 4px 0;">
        <div class="pending-image-wrap">
          <img id="pendingImagePreview" class="pending-image-preview" src="" alt="pending">
          <!-- the X button calls cancelPendingImage() to discard the selection -->
          <button class="pending-image-remove" onclick="cancelPendingImage()">✕</button>
        </div>
      </div>

      <!-- doc indicator: shown above input row when a file is uploaded -->
      <!-- invisible by default, JS adds "visible" class after upload -->
      <div class="doc-indicator" id="docIndicator">
        <span id="docIndicatorText">📄 filename.pdf</span>
        <button class="doc-indicator-remove" onclick="removeDoc()" title="Remove document">✕</button>
      </div>

      <div class="input-row">
        <!-- hidden file input — the paperclip button triggers this -->
        <!-- accept tells the browser which file types to show in the picker -->
        <input type="file" id="fileInput" style="display:none"
               accept=".pdf,.png,.jpg,.jpeg,.gif,.webp"
               onchange="handleFileUpload(this)">

        <!-- paperclip button — clicking it opens the file picker above -->
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Upload PDF or image">📎</button>

        <textarea id="input" placeholder="Ask anything..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
        <button class="stop-btn" id="stopBtn" onclick="stopGeneration()" title="Stop">■</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings Panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header">
    <h2>⚙️ Settings</h2>
    <button class="close-settings" onclick="toggleSettings()">✕</button>
  </div>
  <div class="settings-section">
    <div class="settings-label">Appearance</div>
    <div class="toggle-row">
      <span>Light mode</span>
      <label class="toggle">
        <input type="checkbox" id="lightModeToggle" onchange="toggleLightMode(this)">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
</div>

<script>
let currentChatId = null;
let isThinking = false;
let thinkingFrame = null;
let currentXhr = null;

// --- Mobile sidebar ---
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// --- Settings ---
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}
function toggleLightMode(checkbox) {
  if (checkbox.checked) {
    document.documentElement.classList.add('light');
    localStorage.setItem('theme', 'light');
  } else {
    document.documentElement.classList.remove('light');
    localStorage.setItem('theme', 'dark');
  }
}
if (localStorage.getItem('theme') === 'light') {
  document.documentElement.classList.add('light');
  document.getElementById('lightModeToggle').checked = true;
}

// --- Emoji ---
function insertEmoji(emoji) {
  const input = document.getElementById('input');
  const pos = input.selectionStart;
  input.value = input.value.slice(0, pos) + emoji + input.value.slice(pos);
  input.selectionStart = input.selectionEnd = pos + emoji.length;
  input.focus();
  autoResize(input);
}
function toggleMoreEmoji() {
  document.getElementById('emojiMore').classList.toggle('open');
}

// --- Stop ---
function stopGeneration() {
  if (currentXhr) { currentXhr.abort(); currentXhr = null; }
}

// --- Thinking animation ---
function createThinkingEl() {
  const wrap = document.createElement('div');
  wrap.className = 'thinking-wrap'; wrap.id = 'thinkingEl';
  const av = document.createElement('div');
  av.className = 'avatar ai'; av.textContent = 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'thinking-bubble';
  const canvas = document.createElement('canvas');
  canvas.width = 36; canvas.height = 36;
  const label = document.createElement('span');
  label.className = 'thinking-label'; label.textContent = 'generating...';
  bubble.appendChild(canvas); bubble.appendChild(label);
  wrap.appendChild(av); wrap.appendChild(bubble);
  animateThinking(canvas);
  return wrap;
}
function animateThinking(canvas) {
  const ctx = canvas.getContext('2d');
  const cx = 18, cy = 18; let t = 0;
  function draw() {
    ctx.clearRect(0, 0, 36, 36); t += 0.04;
    const r = 9 * (1 + 0.07 * Math.sin(t * 3.2));
    const grd = ctx.createRadialGradient(cx,cy,r-2,cx,cy,r+7);
    grd.addColorStop(0,'rgba(127,119,221,0.3)');
    grd.addColorStop(1,'rgba(127,119,221,0)');
    ctx.beginPath(); ctx.arc(cx,cy,r+7,0,Math.PI*2); ctx.fillStyle=grd; ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#7f77dd'; ctx.fill();
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2+t, dr=15+2*Math.sin(t*2+i);
      const dx=cx+dr*Math.cos(a), dy=cy+dr*Math.sin(a);
      const dotR=2+1.2*Math.sin(t*2.5+i*1.3), alpha=0.4+0.4*Math.sin(t*2+i);
      ctx.beginPath(); ctx.arc(dx,dy,dotR,0,Math.PI*2);
      ctx.fillStyle=`rgba(83,74,183,${alpha})`; ctx.fill();
    }
    for(let i=0;i<4;i++){
      const a=(i/4)*Math.PI*2+t*0.6, len=3+2*Math.sin(t*3+i*1.7);
      const sx=cx+(r+1)*Math.cos(a), sy=cy+(r+1)*Math.sin(a);
      const ex=cx+(r+1+len)*Math.cos(a), ey=cy+(r+1+len)*Math.sin(a);
      const alpha=0.3+0.5*Math.abs(Math.sin(t*2.8+i));
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey);
      ctx.strokeStyle=`rgba(175,169,236,${alpha})`; ctx.lineWidth=1.2; ctx.stroke();
    }
    thinkingFrame = requestAnimationFrame(draw);
  }
  draw();
}
function removeThinking() {
  if (thinkingFrame) { cancelAnimationFrame(thinkingFrame); thinkingFrame = null; }
  const te = document.getElementById('thinkingEl');
  if (te) te.remove();
}

// --- Chat API ---
async function loadChats() {
  const res = await fetch('/api/chats');
  const chats = await res.json();
  renderChatList(chats);
  if (chats.length === 0) {
    const c = await createChatAPI();
    selectChat(c.id, 'New Conversation');
  } else if (!currentChatId) {
    selectChat(chats[0].id, chats[0].name);
  }
}
async function createChatAPI() {
  const res = await fetch('/api/chats', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name: 'New Conversation'})
  });
  return res.json();
}
function renderChatList(chats) {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chats.forEach(c => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    item.innerHTML = `
      <button class="chat-item-btn" onclick="selectChat('${c.id}','${c.name.replace(/'/g,"\\'")}');closeSidebar()">
        ${c.name}
      </button>
      <button class="del-btn" onclick="deleteChat('${c.id}')">✕</button>
    `;
    list.appendChild(item);
  });
}
async function selectChat(id, name) {
  currentChatId = id;
  document.getElementById('chatTitle').textContent = name;
  const res = await fetch(`/api/chats/${id}/messages`);
  const msgs = await res.json();
  renderMessages(msgs);

  // NEW: fetch chat details to check if it has a doc uploaded
  // We call /api/chats to get all chats, then find this one
  const chatsRes = await fetch('/api/chats');
  const chats = await chatsRes.json();
  const thisChat = chats.find(c => c.id === id);
  // .find() loops through the array and returns the first item where c.id === id
  if (thisChat) updateDocIndicator(thisChat);

  loadChats();
}
async function newChat() {
  const c = await createChatAPI();
  currentChatId = c.id;
  document.getElementById('chatTitle').textContent = 'New Conversation';
  document.getElementById('messages').innerHTML = '';
  closeSidebar();
  loadChats();
}
async function deleteChat(id) {
  await fetch(`/api/chats/${id}`, {method: 'DELETE'});
  if (currentChatId === id) {
    currentChatId = null;
    document.getElementById('messages').innerHTML = '';
  }
  loadChats();
}
function renderMessages(msgs) {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  msgs.forEach(m => appendMessage(m.role, m.content));
  scrollBottom();
}
function appendMessage(role, content) {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (role === 'user' ? ' user' : '');
  const av = document.createElement('div');
  av.className = 'avatar' + (role === 'user' ? ' user-av' : ' ai');
  av.textContent = role === 'user' ? 'U' : 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatContent(content);
  wrap.appendChild(av); wrap.appendChild(bubble);
  container.appendChild(wrap);
  return bubble;
}
function formatContent(text) {
  return text
    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
function sendMessage() {
  const input = document.getElementById('input');
  const prompt = input.value.trim();

  // Allow sending with just an image and no text — like "here's the image"
  if (!prompt && !pendingImageFile) return;
  if (isThinking) return;

  input.value = ''; autoResize(input);

  if (pendingImageFile) {
    // There's an image waiting — upload it first, then send text
    // We show the thinking animation now so the user sees immediate feedback
    isThinking = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('sendBtn').style.display = 'none';
    document.getElementById('stopBtn').classList.add('visible');
    uploadImageAndSend(prompt);
  } else {
    // No image — just send text as before
    if (!currentChatId) {
      createChatAPI().then(c => { currentChatId = c.id; doSend(prompt); });
    } else {
      doSend(prompt);
    }
  }
}
// doSendText: sends just the text prompt to the server after image upload is done.
// Called by uploadImageAndSend() once the image is uploaded.
// doSend() is for regular text messages (no image).
function doSendText(prompt) {
  // At this point isThinking is already true and buttons are already swapped
  // (done in sendMessage before calling uploadImageAndSend)
  const container = document.getElementById('messages');
  container.appendChild(createThinkingEl());
  scrollBottom();

  let assistantBubble = null, fullText = '', processedLength = 0;
  const xhr = new XMLHttpRequest();
  currentXhr = xhr;
  xhr.open('POST', '/api/chat', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onprogress = function() {
    const newText = xhr.responseText.slice(processedLength);
    processedLength = xhr.responseText.length;
    for (const line of newText.split('\n')) {
      if (!line.startsWith('data: ')) continue;
      try {
        const data = JSON.parse(line.slice(6));
        if (data.token !== undefined) {
          removeThinking();
          if (!assistantBubble) assistantBubble = appendMessage('assistant', '');
          fullText += data.token;
          assistantBubble.innerHTML = formatContent(fullText) + '<span style="opacity:0.5">▌</span>';
          if (!userScrolled) scrollBottom();
        }
        if (data.done) { if (assistantBubble) assistantBubble.innerHTML = formatContent(fullText); finish(); }
        if (data.error) {
          removeThinking();
          if (!assistantBubble) assistantBubble = appendMessage('assistant', '');
          assistantBubble.innerHTML = '<span style="color:#e24b4a">Error: ' + data.error + '</span>';
          finish();
        }
      } catch(e) {}
    }
  };
  xhr.onabort = function() {
    removeThinking();
    if (assistantBubble && fullText) {
      assistantBubble.innerHTML = formatContent(fullText) + '<span style="color:var(--text2);font-size:11px;"> [stopped]</span>';
    } else if (!assistantBubble) { appendMessage('assistant', '[stopped]'); }
    finish();
  };
  xhr.onerror = function() {
    removeThinking();
    appendMessage('assistant', 'Connection error. Is Ollama running?');
    finish();
  };
  xhr.send(JSON.stringify({chat_id: currentChatId, prompt: prompt || ''}));
  function finish() {
    isThinking = false; currentXhr = null;
    userScrolled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').classList.remove('visible');
    loadChats();
  }
}

function doSend(prompt) {
  isThinking = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').classList.add('visible');
  appendMessage('user', prompt);
  const container = document.getElementById('messages');
  container.appendChild(createThinkingEl());
  scrollBottom();
  let assistantBubble = null, fullText = '', processedLength = 0;
  const xhr = new XMLHttpRequest();
  currentXhr = xhr;
  xhr.open('POST', '/api/chat', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onprogress = function() {
    const newText = xhr.responseText.slice(processedLength);
    processedLength = xhr.responseText.length;
    for (const line of newText.split('\n')) {
      if (!line.startsWith('data: ')) continue;
      try {
        const data = JSON.parse(line.slice(6));
        if (data.token !== undefined) {
          removeThinking();
          if (!assistantBubble) assistantBubble = appendMessage('assistant', '');
          fullText += data.token;
          assistantBubble.innerHTML = formatContent(fullText) + '<span style="opacity:0.5">▌</span>';
          scrollBottom();
        }
        if (data.done) { if (assistantBubble) assistantBubble.innerHTML = formatContent(fullText); finish(); }
        if (data.error) {
          removeThinking();
          if (!assistantBubble) assistantBubble = appendMessage('assistant', '');
          assistantBubble.innerHTML = `<span style="color:#e24b4a">Error: ${data.error}</span>`;
          finish();
        }
      } catch(e) {}
    }
  };
  xhr.onabort = function() {
    removeThinking();
    if (assistantBubble && fullText) {
      assistantBubble.innerHTML = formatContent(fullText) + '<span style="color:var(--text2);font-size:11px;"> [stopped]</span>';
    } else if (!assistantBubble) { appendMessage('assistant', '[stopped]'); }
    finish();
  };
  xhr.onerror = function() {
    removeThinking();
    appendMessage('assistant', 'Connection error. Is Ollama running?');
    finish();
  };
  xhr.send(JSON.stringify({chat_id: currentChatId, prompt}));
  function finish() {
    isThinking = false; currentXhr = null;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').classList.remove('visible');
    loadChats();
  }
}
function scrollBottom() { const m = document.getElementById('messages'); m.scrollTop = m.scrollHeight; }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

// --- Pending image state ---
// When a user picks or pastes an image, we don't upload it immediately.
// Instead we hold it here as a "pending" image and show a preview thumbnail.
// When they hit send, THEN we upload it and send the message together.
// This matches how Claude/Gemini/Discord work.
let pendingImageFile = null;   // holds the File object waiting to be uploaded
let pendingImageUrl = null;    // holds the local preview URL (blob URL)

// showPendingImage: takes a File object and shows the thumbnail preview
// A "blob URL" is a temporary URL like "blob://..." that points to data
// in memory — it lets the browser display an image without uploading it.
function showPendingImage(file) {
  pendingImageFile = file;
  pendingImageUrl = URL.createObjectURL(file);
  // URL.createObjectURL creates a temporary browser-only URL for the file.
  // It's instant — no upload happens. Just a way to preview locally.

  const preview = document.getElementById('pendingImagePreview');
  const wrap = document.getElementById('pendingImageWrap');
  preview.src = pendingImageUrl;   // set the <img> src to our blob URL
  wrap.style.display = 'block';    // make the preview visible
}

// cancelPendingImage: user clicked the X on the thumbnail — discard the image
function cancelPendingImage() {
  pendingImageFile = null;
  if (pendingImageUrl) {
    URL.revokeObjectURL(pendingImageUrl);
    // revokeObjectURL frees the memory used by the blob URL.
    // Always do this when you're done with a blob URL — it's good practice.
    pendingImageUrl = null;
  }
  document.getElementById('pendingImageWrap').style.display = 'none';
  document.getElementById('pendingImagePreview').src = '';
}

// --- Paste image (Ctrl+V) ---
// Listen for paste events on the whole page.
// We check if the clipboard contains an image — if yes, we handle it.
// If it's just text, we do nothing and let the browser paste normally.
document.addEventListener('paste', function(e) {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;

  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/')) {
      e.preventDefault();
      // Stop the browser from doing its own weird image paste behavior

      const file = items[i].getAsFile();
      if (!file) return;

      // Give the pasted image a proper filename with a timestamp
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const ext = file.type.split('/')[1] || 'png';
      const namedFile = new File([file], 'pasted-image-' + timestamp + '.' + ext, { type: file.type });

      // Show the thumbnail preview — don't upload yet
      showPendingImage(namedFile);
      return;
    }
  }
  // No image found in clipboard — let normal text paste happen
});

// --- File Upload ---
// --- File Upload ---

// handleFileUpload: called when user picks a file via the paperclip button.
// For IMAGES: just show a preview thumbnail — don't upload yet.
// For PDFs: upload immediately since they don't show as a visual preview.
function handleFileUpload(input) {
  const file = input.files[0];
  if (!file) return;

  const ext = file.name.rsplit ? file.name.split('.').pop().toLowerCase()
                                : file.name.split('.').pop().toLowerCase();
  const imageExts = ['png', 'jpg', 'jpeg', 'gif', 'webp'];

  if (imageExts.includes(ext) || file.type.startsWith('image/')) {
    // IMAGE: show preview thumbnail, hold in pendingImageFile
    // Upload happens later when user hits send
    showPendingImage(file);
  } else {
    // PDF: upload right away and show the doc indicator
    uploadPDF(file);
  }

  // Reset the file input so picking the same file again triggers onchange
  if (input.value !== undefined) input.value = '';
}

// uploadPDF: handles the actual HTTP upload for PDF files
async function uploadPDF(file) {
  if (!currentChatId) {
    const c = await createChatAPI();
    currentChatId = c.id;
    loadChats();
  }

  const indicator = document.getElementById('docIndicator');
  const indicatorText = document.getElementById('docIndicatorText');
  indicator.classList.add('visible');
  indicatorText.textContent = '⏳ Processing PDF...';

  // FormData is the only way to send binary files over HTTP.
  // JSON can only hold text — FormData can hold files.
  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/chats/' + currentChatId + '/upload', {
      method: 'POST',
      body: formData
      // IMPORTANT: Never set Content-Type manually with FormData.
      // The browser sets it with the correct "boundary" string automatically.
    });
    const data = await res.json();

    if (data.ok) {
      indicatorText.textContent = '📄 ' + data.filename + ' (' + data.chunks + ' chunks)';
    } else {
      alert('Upload failed: ' + data.error);
      indicator.classList.remove('visible');
    }
  } catch (e) {
    alert('Upload error: ' + e.message);
    indicator.classList.remove('visible');
  }
}

// uploadImageAndSend: uploads the pending image then sends the message.
// Called from doSend() when there's a pendingImageFile waiting.
async function uploadImageAndSend(prompt) {
  // Ensure we have a chat to attach the image to
  if (!currentChatId) {
    const c = await createChatAPI();
    currentChatId = c.id;
    loadChats();
  }

  const formData = new FormData();
  formData.append('file', pendingImageFile);

  try {
    const res = await fetch('/api/chats/' + currentChatId + '/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();

    if (data.ok) {
      // Show image in the chat as a user message bubble BEFORE the text
      // data.url is like "/uploads/abc123.png" — a real URL we can use in <img>
      appendImageMessage(data.url, prompt);

      // Update doc indicator
      const indicator = document.getElementById('docIndicator');
      const indicatorText = document.getElementById('docIndicatorText');
      indicatorText.textContent = '🖼️ ' + data.filename;
      indicator.classList.add('visible');

      // Clear the pending image state
      cancelPendingImage();

      // Now send the text message — the server already knows about the image
      doSendText(prompt);
    } else {
      alert('Image upload failed: ' + data.error);
      cancelPendingImage();
    }
  } catch (e) {
    alert('Image upload error: ' + e.message);
    cancelPendingImage();
  }
}

// appendImageMessage: adds an image + text bubble to the chat UI.
// This is what makes it look like Claude/Gemini — image shown inside the bubble.
function appendImageMessage(imageUrl, text) {
  const container = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg user';   // user message, aligned to the right

  const av = document.createElement('div');
  av.className = 'avatar user-av';
  av.textContent = 'U';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // Create the image element inside the bubble
  const img = document.createElement('img');
  img.src = imageUrl;            // e.g. "/uploads/abc123.png"
  img.className = 'bubble-image';
  img.alt = 'uploaded image';
  bubble.appendChild(img);      // image goes first, text below it

  // Add the text below the image (if there is any)
  if (text) {
    const textSpan = document.createElement('div');
    textSpan.innerHTML = formatContent(text);
    bubble.appendChild(textSpan);
  }

  wrap.appendChild(av);
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  scrollBottom();
}

// removeDoc hides the indicator. Does NOT delete ChromaDB data.
// Full delete happens only when the chat is deleted.
function removeDoc() {
  document.getElementById('docIndicator').classList.remove('visible');
}

// When switching chats, show or hide the doc indicator based on whether
// that chat has a document uploaded.
function updateDocIndicator(chat) {
  const indicator = document.getElementById('docIndicator');
  const indicatorText = document.getElementById('docIndicatorText');
  if (chat.doc_name) {
    const ext = chat.doc_name.split('.').pop().toLowerCase();
    // .split('.') splits "notes.pdf" into ["notes", "pdf"]
    // .pop() takes the last item: "pdf"
    const icon = ['png','jpg','jpeg','gif','webp'].includes(ext) ? '🖼️' : '📄';
    indicatorText.textContent = icon + ' ' + chat.doc_name;
    indicator.classList.add('visible');
  } else {
    indicator.classList.remove('visible');
  }
}

loadChats();
